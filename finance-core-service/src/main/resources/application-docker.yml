spring:
  datasource:
    url: jdbc:mysql://finance-core-db:3306/financetracker_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

services:
  user-service-url: http://user-service:8080

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
