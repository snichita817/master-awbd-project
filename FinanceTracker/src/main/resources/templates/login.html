<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – Finance Tracker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.1);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 1.5rem; text-align: center; }
        .alert {
            border-radius: 4px;
            padding: .6rem .9rem;
            margin-bottom: 1rem;
            font-size: .875rem;
        }
        .alert-danger { background: #fed7d7; color: #c53030; }
        .alert-success { background: #c6f6d5; color: #276749; }
        label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .3rem; color: #4a5568; }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: .55rem .75rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,.2); }
        .remember { display: flex; align-items: center; gap: .5rem; font-size: .875rem; color: #4a5568; margin-bottom: 1rem; }
        button[type="submit"] {
            width: 100%;
            padding: .65rem;
            background: #3182ce;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: #2b6cb0; }
    </style>
</head>
<body>
<div class="card">
    <h1>Finance Tracker</h1>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Email address</label>
        <input type="email" id="username" name="username"
               placeholder="you@example.com" required autofocus/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required/>

        <div class="remember">
            <input type="checkbox" id="remember-me" name="remember-me"/>
            <label for="remember-me" style="font-weight:normal;margin-bottom:0;">Remember me</label>
        </div>

        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
