<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Budgets  -  Finance Tracker</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1>Budgets</h1>
        <a th:href="@{/budgets/new}" class="btn btn-primary">+ New Budget</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(budgets)}" style="background:#fff;border-radius:8px;padding:2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#718096;">
        No budgets yet. <a th:href="@{/budgets/new}">Create your first one.</a>
    </div>

    <table th:unless="${#lists.isEmpty(budgets)}">
        <thead>
            <tr>
                <th>Category</th>
                <th>Max Limit (RON)</th>
                <th>Current Spending (RON)</th>
                <th>Status</th>
                <th style="width:160px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${budgets}">
                <td th:text="${b.category != null ? b.category.name : ' - '}"></td>
                <td th:text="${#numbers.formatDecimal(b.maxLimit, 1, 2)}"></td>
                <td th:text="${#numbers.formatDecimal(spendingByCategory[b.category?.name] ?: 0, 1, 2)}"></td>
                <td>
                    <span th:if="${spendingByCategory[b.category?.name] != null and spendingByCategory[b.category?.name].compareTo(b.maxLimit) > 0}"
                          class="badge badge-orange">Over Budget</span>
                    <span th:unless="${spendingByCategory[b.category?.name] != null and spendingByCategory[b.category?.name].compareTo(b.maxLimit) > 0}"
                          class="badge badge-green">OK</span>
                </td>
                <td>
                    <a th:href="@{/budgets/{id}/edit(id=${b.id})}" class="btn btn-secondary btn-sm">Edit</a>
                    <form th:action="@{/budgets/{id}/delete(id=${b.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this budget?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
