<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

<head>
    <title>404 Not Found  -  Finance Tracker</title>
</head>
<body>
<main>

        <h1 style="font-size:1.5rem;margin-bottom:.75rem;color:#2d3748;">Page Not Found</h1>

</html>
