<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Record Transaction – Finance Tracker</title>
</head>
<body>
<main>
    <h1>Record Transaction</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <form th:action="@{/transactions}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="subscriptionId">Subscription <span style="color:#e53e3e;">*</span></label>
                <select id="subscriptionId" name="subscriptionId" required>
                    <option value="">— select a subscription —</option>
                    <option th:each="sub : ${subscriptions}"
                            th:value="${sub.id}"
                            th:text="${sub.name} + ' (' + ${#numbers.formatDecimal(sub.price, 1, 2)} + ' RON)'">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="transactionDate">Transaction Date &amp; Time <span style="color:#718096;font-weight:400;">(optional — defaults to now)</span></label>
                <input type="datetime-local" id="transactionDate" name="transactionDate"/>
                <div style="font-size:.8rem;color:#718096;margin-top:.25rem;">
                    The amount will be set automatically from the subscription price.
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Record</button>
                <a th:href="@{/transactions}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
