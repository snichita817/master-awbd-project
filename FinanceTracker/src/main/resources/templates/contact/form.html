<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Contact Support - Finance Tracker</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1>Contact Support</h1>
    </div>

    <div class="card" style="max-width:600px;">
        <form th:action="@{/contact}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" maxlength="200" required
                       placeholder="Brief summary of your issue"/>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required
                          placeholder="Describe your issue in detail..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Ticket</button>
                <a th:href="@{/contact/my-tickets}" class="btn btn-secondary">My Tickets</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
