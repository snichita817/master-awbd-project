<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title th:text="${category.id == null ? 'New Category' : 'Edit Category'} + ' – Finance Tracker'">Category – Finance Tracker</title>
</head>
<body>
<main>
    <h1 th:text="${category.id == null ? 'New Category' : 'Edit Category'}">Category</h1>

    <div class="card">
        <form th:action="${formAction}" th:object="${category}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="name">Name <span style="color:#e53e3e;">*</span></label>
                <input type="text" id="name" th:field="*{name}"
                       placeholder="e.g. Entertainment"
                       required maxlength="100"/>
                <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"
                          placeholder="Optional description…" maxlength="500"></textarea>
                <div class="error-msg" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
