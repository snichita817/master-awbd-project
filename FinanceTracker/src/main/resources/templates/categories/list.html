<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Categories  -  Finance Tracker</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1>Categories</h1>
        <a th:href="@{/categories/new}" class="btn btn-primary">+ New Category</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(categories)}" style="background:#fff;border-radius:8px;padding:2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#718096;">
        No categories yet. <a th:href="@{/categories/new}">Create your first one.</a>
    </div>

    <table th:unless="${#lists.isEmpty(categories)}">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th style="width:160px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.name}"></td>
                <td th:text="${cat.description != null ? cat.description : ' - '}"></td>
                <td>
                    <a th:href="@{/categories/{id}/edit(id=${cat.id})}" class="btn btn-secondary btn-sm">Edit</a>
                    <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this category?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
