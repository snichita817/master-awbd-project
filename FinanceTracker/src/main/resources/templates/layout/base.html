<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="${title}">Finance Tracker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #1a202c; }
        nav {
            background: #2d3748; color: #fff; padding: .75rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: #fff; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: .25rem; }
        .nav-links a {
            color: #a0aec0; text-decoration: none; padding: .35rem .7rem;
            border-radius: 4px; font-size: .9rem; transition: background .15s;
        }
        .nav-links a:hover, .nav-links a.active { background: #4a5568; color: #fff; }
        .nav-right { display: flex; align-items: center; gap: 1rem; font-size: .875rem; color: #a0aec0; }
        form.logout-form { display: inline; }
        button.logout {
            background: none; border: 1px solid #718096; color: #e2e8f0;
            padding: .3rem .75rem; border-radius: 4px; cursor: pointer; font-size: .85rem;
        }
        button.logout:hover { background: #4a5568; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        /* Table */
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        th { background: #edf2f7; text-align: left; padding: .6rem 1rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #4a5568; }
        td { padding: .65rem 1rem; border-top: 1px solid #e2e8f0; font-size: .9rem; vertical-align: middle; }
        /* Buttons */
        .btn {
            display: inline-block; padding: .45rem .9rem; border-radius: 4px;
            font-size: .875rem; font-weight: 600; text-decoration: none;
            border: none; cursor: pointer; line-height: 1.4;
        }
        .btn-primary { background: #3182ce; color: #fff; }
        .btn-primary:hover { background: #2b6cb0; }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        .btn-secondary:hover { background: #cbd5e0; }
        .btn-danger { background: #e53e3e; color: #fff; }
        .btn-danger:hover { background: #c53030; }
        .btn-sm { padding: .3rem .6rem; font-size: .8rem; }
        /* Form */
        .card {
            background: #fff; border-radius: 8px; padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); max-width: 520px;
        }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .3rem; color: #4a5568; }
        input[type="text"], input[type="email"], input[type="number"], input[type="password"], select, textarea {
            width: 100%; padding: .5rem .75rem; border: 1px solid #cbd5e0;
            border-radius: 4px; font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,.2); }
        textarea { resize: vertical; min-height: 80px; }
        .error-msg { color: #c53030; font-size: .8rem; margin-top: .25rem; }
        .form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; }
        /* Alert */
        .alert { border-radius: 4px; padding: .6rem .9rem; margin-bottom: 1rem; font-size: .875rem; }
        .alert-success { background: #c6f6d5; color: #276749; }
        .alert-danger  { background: #fed7d7; color: #c53030; }
        /* Page header row */
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
        .page-header h1 { margin-bottom: 0; }
        /* Badge */
        .badge { display: inline-block; padding: .2rem .55rem; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
        .badge-blue   { background: #bee3f8; color: #2b6cb0; }
        .badge-green  { background: #c6f6d5; color: #276749; }
        .badge-gray   { background: #e2e8f0; color: #4a5568; }
        .badge-orange { background: #feebc8; color: #c05621; }
        /* Summary cards (dashboard) */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card-stat { background: #fff; border-radius: 8px; padding: 1.25rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .card-stat h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: #718096; margin-bottom: .5rem; }
        .card-stat .value { font-size: 1.8rem; font-weight: 700; color: #1a202c; }
        .value-green  { color: #276749 !important; }
        .value-blue   { color: #2b6cb0 !important; }
        .value-orange { color: #c05621 !important; }
        /* Misc */
        .empty { color: #a0aec0; font-style: italic; padding: 1rem; }
        h2 { font-size: 1.1rem; margin-bottom: .75rem; }
    </style>
</head>
<body>
<nav>
    <a class="brand" th:href="@{/dashboard}">Finance Tracker</a>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/categories}">Categories</a>
        <a th:href="@{/payment-methods}">Payment Methods</a>
        <a th:href="@{/subscriptions}" sec:authorize="isAuthenticated()">Subscriptions</a>
        <a th:href="@{/subscriptions/share-requests}" sec:authorize="isAuthenticated()">Share Requests</a>
        <a th:href="@{/transactions}" sec:authorize="isAuthenticated()">Transactions</a>
        <a th:href="@{/budgets}" sec:authorize="isAuthenticated()">Budgets</a>
        <a th:href="@{/contact}" sec:authorize="isAuthenticated()">Support</a>
        <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Users</a>
        <a th:href="@{/admin/tickets}" sec:authorize="hasRole('ADMIN')">Tickets</a>
    </div>
    <div class="nav-right">
        <span sec:authentication="name"></span>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</nav>
<main th:replace="${content}">
    Page content goes here.
</main>
</body>
</html>
