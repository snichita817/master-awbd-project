<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Payment Methods  -  Finance Tracker</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1>Payment Methods</h1>
        <a th:href="@{/payment-methods/new}" class="btn btn-primary">+ New Payment Method</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(paymentMethods)}" style="background:#fff;border-radius:8px;padding:2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#718096;">
        No payment methods yet. <a th:href="@{/payment-methods/new}">Add your first one.</a>
    </div>

    <table th:unless="${#lists.isEmpty(paymentMethods)}">
        <thead>
            <tr>
                <th>Type</th>
                <th>Details</th>
                <th style="width:160px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pm : ${paymentMethods}">
                <td>
                    <span class="badge badge-blue" th:text="${pm.type}"></span>
                </td>
                <td th:text="${pm.details}"></td>
                <td>
                    <a th:href="@{/payment-methods/{id}/edit(id=${pm.id})}" class="btn btn-secondary btn-sm">Edit</a>
                    <form th:action="@{/payment-methods/{id}/delete(id=${pm.id})}" method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this payment method?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
