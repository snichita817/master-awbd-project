<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title th:text="${subscription.id == null ? 'New Subscription' : 'Edit Subscription'} + '  -  Finance Tracker'">Subscription  -  Finance Tracker</title>
</head>
<body>
<main>
    <h1 th:text="${subscription.id == null ? 'New Subscription' : 'Edit Subscription'}">Subscription</h1>

    <div class="card">
        <form th:action="${formAction}" th:object="${subscription}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="name">Name <span style="color:#e53e3e;">*</span></label>
                <input type="text" id="name" th:field="*{name}"
                       placeholder="e.g. Netflix"
                       required maxlength="100"/>
                <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label for="price">Price (RON) <span style="color:#e53e3e;">*</span></label>
                <input type="number" id="price" th:field="*{price}"
                       placeholder="e.g. 39.99"
                       required min="0.01" step="0.01"/>
                <div class="error-msg" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="form-group">
                <label for="billingFrequency">Billing Frequency <span style="color:#e53e3e;">*</span></label>
                <select id="billingFrequency" th:field="*{billingFrequency}" required>
                    <option value=""> -  select frequency  - </option>
                    <option th:each="freq : ${billingFrequencies}"
                            th:value="${freq}"
                            th:text="${freq.name().replace('_', ' ')}">
                    </option>
                </select>
                <div class="error-msg" th:if="${#fields.hasErrors('billingFrequency')}" th:errors="*{billingFrequency}"></div>
            </div>

            <div class="form-group">
                <label for="renewalDate">Renewal Date <span style="color:#e53e3e;">*</span></label>
                <input type="date" id="renewalDate" th:field="*{renewalDate}" required/>
                <div class="error-msg" th:if="${#fields.hasErrors('renewalDate')}" th:errors="*{renewalDate}"></div>
            </div>

            <div class="form-group">
                <label for="categoryId">Category</label>
                <select id="categoryId" name="categoryId">
                    <option value=""> -  none  - </option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == cat.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentMethodId">Payment Method</label>
                <select id="paymentMethodId" name="paymentMethodId">
                    <option value=""> -  none  - </option>
                    <option th:each="pm : ${paymentMethods}"
                            th:value="${pm.id}"
                            th:text="${pm.type.name().replace('_', ' ')} + (${pm.details != null ? '  -  ' + pm.details : ''})"
                            th:selected="${selectedPaymentMethodId != null and selectedPaymentMethodId == pm.id}">
                    </option>
                </select>
            </div>

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" style="margin-bottom:1rem;">
                <span th:each="err : ${#fields.allErrors()}" th:text="${err}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/subscriptions}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
