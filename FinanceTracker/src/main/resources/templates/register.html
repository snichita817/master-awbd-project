<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – Finance Tracker</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,.1);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 1.5rem; text-align: center; }
        .alert {
            border-radius: 4px;
            padding: .6rem .9rem;
            margin-bottom: 1rem;
            font-size: .875rem;
        }
        .alert-danger { background: #fed7d7; color: #c53030; }
        label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .3rem; color: #4a5568; }
        input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: .55rem .75rem;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: .25rem;
        }
        input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,.2); }
        .field-error { color: #c53030; font-size: .8rem; margin-bottom: .75rem; display: block; }
        .field-ok { margin-bottom: 1rem; }
        button[type="submit"] {
            width: 100%;
            padding: .65rem;
            background: #3182ce;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: .5rem;
        }
        button[type="submit"]:hover { background: #2b6cb0; }
        .footer-link { text-align: center; margin-top: 1.25rem; font-size: .875rem; color: #4a5568; }
        .footer-link a { color: #3182ce; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Create Account</h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

        <label for="name">Full name</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Jane Doe" autofocus/>
        <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <div th:unless="${#fields.hasErrors('name')}" class="field-ok"></div>

        <label for="email">Email address</label>
        <input type="email" id="email" th:field="*{email}" placeholder="you@example.com"/>
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <div th:unless="${#fields.hasErrors('email')}" class="field-ok"></div>

        <label for="password">Password <small style="font-weight:normal;color:#718096;">(min 8 characters)</small></label>
        <input type="password" id="password" th:field="*{password}" placeholder="••••••••"/>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        <div th:unless="${#fields.hasErrors('password')}" class="field-ok"></div>

        <label for="monthlyIncome">Monthly income (RON)</label>
        <input type="number" id="monthlyIncome" th:field="*{monthlyIncome}" placeholder="0.00" min="0" step="0.01"/>
        <span class="field-error" th:if="${#fields.hasErrors('monthlyIncome')}" th:errors="*{monthlyIncome}"></span>
        <div th:unless="${#fields.hasErrors('monthlyIncome')}" class="field-ok"></div>

        <button type="submit">Create account</button>
    </form>

    <div class="footer-link">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
