spring:
  datasource:
    url: jdbc:mysql://user-db:3306/financetracker_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

services:
  finance-core-url: http://finance-core-service:8081
  reporting-url: http://reporting-service:8082
