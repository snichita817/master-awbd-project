<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>Subscriptions - Finance Tracker</title>
</head>
<body>
<main>
    <div class="page-header">
        <h1>Subscriptions</h1>
        <a th:href="@{/subscriptions/new}" class="btn btn-primary">+ New Subscription</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap;">
        <span style="font-weight:500;">Sort by:</span>
        <a th:href="@{/subscriptions(page=0,size=${currentSize},sort='name',dir=${currentSort=='name'?reverseDir:'asc'})}"
           th:class="${currentSort=='name'} ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'">Name</a>
        <a th:href="@{/subscriptions(page=0,size=${currentSize},sort='price',dir=${currentSort=='price'?reverseDir:'desc'})}"
           th:class="${currentSort=='price'} ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'">Price</a>
        <a th:href="@{/subscriptions(page=0,size=${currentSize},sort='renewalDate',dir=${currentSort=='renewalDate'?reverseDir:'asc'})}"
           th:class="${currentSort=='renewalDate'} ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'">Renewal Date</a>
        <span style="margin-left:auto;">Page size:
            <a th:each="s : ${#arrays.toArray({5,10,20})}"
               th:href="@{/subscriptions(page=0,size=${s},sort=${currentSort},dir=${currentDir})}"
               th:text="${s}"
               th:class="${currentSize==s} ? 'btn btn-primary btn-sm' : 'btn btn-secondary btn-sm'"></a>
        </span>
    </div>

    <div th:if="${#lists.isEmpty(subscriptions)}" style="background:#fff;border-radius:8px;padding:2rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#718096;">
        No subscriptions yet. <a th:href="@{/subscriptions/new}">Add your first one.</a>
    </div>

    <table th:unless="${#lists.isEmpty(subscriptions)}">
        <thead>
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Payment Method</th>
            <th>Price (RON)</th>
            <th>Billing</th>
            <th>Renewal Date</th>
            <th style="width:180px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sub : ${subscriptions}">
            <td th:text="${sub.name}"></td>
            <td th:text="${sub.category != null ? sub.category.name : ' - '}"></td>
            <td th:text="${sub.paymentMethod != null ? sub.paymentMethod.type + ' - ' + sub.paymentMethod.details : ' - '}"></td>
            <td th:text="${#numbers.formatDecimal(sub.price, 1, 2)}"></td>
            <td><span class="badge badge-blue" th:text="${sub.billingFrequency}"></span></td>
            <td th:text="${#temporals.format(sub.renewalDate, 'dd MMM yyyy')}"></td>
            <td>
                <a th:href="@{/subscriptions/{id}/edit(id=${sub.id})}" class="btn btn-secondary btn-sm">Edit</a>
                <a th:href="@{/subscriptions/{id}/shares(id=${sub.id})}" class="btn btn-secondary btn-sm">Shares</a>
                <form th:action="@{/subscriptions/{id}/delete(id=${sub.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Delete this subscription?');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{layout/pagination :: pagNav(${activePage}, '/subscriptions', ${currentSize}, ${currentSort}, ${currentDir}, null)}"></div>
</main>
</body>
</html>
