<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title th:text="${paymentMethod.id == null ? 'New Payment Method' : 'Edit Payment Method'} + '  -  Finance Tracker'">Payment Method - Finance Tracker</title>
</head>
<body>
<main>
    <h1 th:text="${paymentMethod.id == null ? 'New Payment Method' : 'Edit Payment Method'}">Payment Method</h1>

    <div class="card">
        <form th:action="${formAction}" th:object="${paymentMethod}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="type">Type <span style="color:#e53e3e;">*</span></label>
                <select id="type" th:field="*{type}" required>
                    <option value=""> -  Select type  - </option>
                    <option th:each="pt : ${paymentTypes}"
                            th:value="${pt}"
                            th:text="${pt.name().replace('_', ' ')}"></option>
                </select>
                <div class="error-msg" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
            </div>

            <div class="form-group">
                <label for="details">Details <span style="color:#e53e3e;">*</span></label>
                <input type="text" id="details" th:field="*{details}"
                       placeholder="e.g. Visa ending in 1234"
                       required maxlength="255"/>
                <div class="error-msg" th:if="${#fields.hasErrors('details')}" th:errors="*{details}"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <a th:href="@{/payment-methods}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
