<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}" lang="en">
<head>
    <title>500 Internal Server Error - Finance Tracker</title>
</head>
<body>
<main>
    <div style="text-align:center;padding:4rem 1rem;">
        <div style="font-size:5rem;font-weight:800;color:#fed7d7;">500</div>
        <h1 style="font-size:1.5rem;margin-bottom:.75rem;color:#2d3748;">Something Went Wrong</h1>
        <p style="color:#718096;margin-bottom:.5rem;">
            An unexpected error occurred on the server.
        </p>
        <p th:if="${message}" th:text="${message}" style="color:#c53030;font-size:.875rem;margin-bottom:1.5rem;"></p>
        <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
    </div>
</main>
</body>
</html>
