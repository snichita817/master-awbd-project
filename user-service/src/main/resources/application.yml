spring:
  application:
    name: Personal Finance & Subscription Tracker
  profiles:
    active: dev
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  config: classpath:logback-spring.xml

services:
  finance-core-url: http://localhost:8081
  reporting-url: http://localhost:8082
