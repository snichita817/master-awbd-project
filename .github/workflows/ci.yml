name: CI

on:
  push:
    branches:
      - main
      - dev
      - microservices-migration
  pull_request:
    branches:
      - main
      - dev
      - microservices-migration

jobs:
  test-monolith:
    name: Test monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run monolith tests
        working-directory: FinanceTracker
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

  test-user-service:
    name: Test user-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run user-service tests
        working-directory: user-service
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

  test-finance-core-service:
    name: Test finance-core-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run finance-core-service tests
        working-directory: finance-core-service
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

  test-reporting-service:
    name: Test reporting-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run reporting-service tests
        working-directory: reporting-service
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dspring.profiles.active=test

  docker-build:
    name: Build Docker Compose stack
    runs-on: ubuntu-latest
    needs:
      - test-monolith
      - test-user-service
      - test-finance-core-service
      - test-reporting-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build microservice images
        run: docker compose build
