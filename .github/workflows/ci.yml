name: CI

on:
  push:
    branches:
      - main
      - dev
      - microservices-migration
  pull_request:
    branches:
      - main
      - dev
      - microservices-migration

jobs:
  test-monolith:
    name: Test monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run monolith verification
        working-directory: FinanceTracker
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dspring.profiles.active=test

      - name: Upload monolith coverage report
        uses: actions/upload-artifact@v4
        with:
          name: monolith-jacoco-report
          path: FinanceTracker/target/site/jacoco
          if-no-files-found: warn

  test-user-service:
    name: Test user-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run user-service verification
        working-directory: user-service
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dspring.profiles.active=test

      - name: Upload user-service coverage report
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jacoco-report
          path: user-service/target/site/jacoco
          if-no-files-found: warn

  test-finance-core-service:
    name: Test finance-core-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run finance-core-service verification
        working-directory: finance-core-service
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dspring.profiles.active=test

      - name: Upload finance-core-service coverage report
        uses: actions/upload-artifact@v4
        with:
          name: finance-core-service-jacoco-report
          path: finance-core-service/target/site/jacoco
          if-no-files-found: warn

  test-reporting-service:
    name: Test reporting-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run reporting-service verification
        working-directory: reporting-service
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Dspring.profiles.active=test

      - name: Upload reporting-service coverage report
        uses: actions/upload-artifact@v4
        with:
          name: reporting-service-jacoco-report
          path: reporting-service/target/site/jacoco
          if-no-files-found: warn

  docker-build:
    name: Build Docker Compose stack
    runs-on: ubuntu-latest
    needs:
      - test-monolith
      - test-user-service
      - test-finance-core-service
      - test-reporting-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build microservice images
        run: docker compose build
